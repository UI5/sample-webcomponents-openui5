<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/png" href="./favicon.ico" />
		<title>UI5 Web Components OpenUI5/SAPUI5 Sample Application</title>

		<script
			id="sap-ui-bootstrap"
			src="https://sdk.openui5.org/1.120.17/resources/sap-ui-core.js"
			data-sap-ui-theme="sap_horizon"
			data-sap-ui-compat-version="edge"
			data-sap-ui-async="true"
			data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
			data-sap-ui-resource-roots='{ "sample.webcomponents.openui5": "./" }'
		></script>
	</head>
	<body class="sapUiBody" id="content">
		<div
			data-sap-ui-component
			data-name="sample.webcomponents.openui5"
			data-id="container"
			data-height="100%"
		></div>
	</body>
</html>
