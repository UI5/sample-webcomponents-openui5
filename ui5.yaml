specVersion: "3.0"
metadata:
  name: sample-webcomponents-openui5
type: application
framework:
  name: OpenUI5
  version: "1.120.17"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.ui.unified
    - name: themelib_sap_horizon
    - name: themelib_sap_fiori_3
builder:
  customTasks:
    # Transpiles TypeScript to JS at build time.
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
    # Resolves/bundles the @ui5/webcomponents-* packages and generates the
    # SAPUI5 control wrappers + registers their Assets (themes + translations).
    - name: ui5-tooling-modules-task
      afterTask: ui5-tooling-transpile-task
      configuration:
        removeScopePrefix: true
        sanitizeNpmPackageName: true
        pluginOptions:
          webcomponents:
            includeAssets: true
            forceAllAssets: true
server:
  customMiddleware:
    # Transpiles the TypeScript sources on the fly for the dev server.
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
    # Resolves the Web Components modules + Assets for the dev server.
    - name: ui5-tooling-modules-middleware
      afterMiddleware: ui5-tooling-transpile-middleware
      configuration:
        pluginOptions:
          webcomponents:
            includeAssets: true
            forceAllAssets: true
    - name: ui5-middleware-livereload
      afterMiddleware: compression
      configuration:
        extraExts: "xml,json,properties"
